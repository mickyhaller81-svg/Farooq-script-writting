<text x="600.0" y="830" font-size="27" text-anchor="middle" font-family="Georgia, serif" font-style="italic" fill="#222">He spends Sunday with the kids at the park while she rests at home in the AC —</text><text x="600.0" y="866" font-size="27" text-anchor="middle" font-family="Georgia, serif" font-style="italic" fill="#222">and then tells her friends he “never takes the family anywhere.”</text>
